<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Container tile with rounded corners: guarantees 100% contrast on all browser tabs -->
  <rect width="120" height="100" rx="22" fill="#111111"/>

  <!-- Logo 3: Interlocking Weave (Dual Lambda -> M) -->
  <!-- Left Lambda -->
  <path d="M 36 22 C 37 28, 45 60, 57 78 L 50 78 C 42 62, 34 38, 33 26 Z" fill="#f8fafc"/>
  <path d="M 35 44 C 27 54, 21 68, 14 78 L 21 78 C 26 68, 32 56, 37 47 Z" fill="#f8fafc"/>

  <!-- Knockout gap: 7px stroke in the container color, creating the 2.5D weave -->
  <path d="M 73 44 C 65 54, 59 68, 51 79 L 60 79 C 65 68, 71 56, 76 47 Z" stroke="#111111" stroke-width="7" fill="#111111"/>

  <!-- Right Lambda (weaves over left lambda) -->
  <path d="M 74 22 C 75 28, 83 60, 95 78 L 88 78 C 80 62, 72 38, 71 26 Z" fill="#f8fafc"/>
  <path d="M 73 44 C 65 54, 59 68, 52 78 L 59 78 C 64 68, 70 56, 75 47 Z" fill="#f8fafc"/>
</svg>
