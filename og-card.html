<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #111111;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .og-container {
      width: 1200px;
      height: 630px;
      background: #111111;
      padding: 5rem 5.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .full-lockup {
      display: flex;
      align-items: center;
      gap: 2.25rem;
    }
    .full-logo {
      width: 110px;
      height: 88px;
      flex-shrink: 0;
    }
    .full-text {
      display: flex;
      flex-direction: column;
    }
    .full-brand {
      font-family: "Newsreader", "Charis SIL", "Georgia", "Cambria", serif;
      font-size: 4.5rem;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.05;
      margin: 0;
      color: #f5f5f5;
    }
    .full-tagline {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      margin-top: 0.65rem;
      color: #999999;
    }
    .full-divider {
      height: 1px;
      width: 100%;
      background: #262626;
      margin: 2.25rem 0;
    }
    .full-footer-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
    }
    .full-label {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.95rem;
      font-weight: 500;
      color: #a3a3a3;
    }
    .full-url {
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      color: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="full-lockup">
      <svg class="full-logo" viewBox="0 0 120 100" fill="none" role="img" aria-label="LambdaMatters Logo">
        <defs>
          <mask id="gap-opt2">
            <rect width="120" height="100" fill="#ffffff" />
            <path d="M 73 44 C 65 54, 59 68, 51 79 L 60 79 C 65 68, 71 56, 76 47 Z"
                  fill="#000000" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
          </mask>
        </defs>
        <g fill="#f5f5f5">
          <g mask="url(#gap-opt2)">
            <path d="M 36 22 C 37 28, 45 60, 57 78 L 50 78 C 42 62, 34 38, 33 26 Z" />
            <path d="M 35 44 C 27 54, 21 68, 14 78 L 21 78 C 26 68, 32 56, 37 47 Z" />
          </g>
          <path d="M 74 22 C 75 28, 83 60, 95 78 L 88 78 C 80 62, 72 38, 71 26 Z" />
          <path d="M 73 44 C 65 54, 59 68, 52 78 L 59 78 C 64 68, 70 56, 75 47 Z" />
        </g>
      </svg>
      <div class="full-text">
        <h1 class="full-brand">LambdaMatters</h1>
        <p class="full-tagline">Systems Architecture · Distributed Systems · Applied AI</p>
      </div>
    </div>
    <div class="full-divider"></div>
    <div class="full-footer-row">
      <span class="full-label">Independent Applied Systems Research Lab</span>
      <span class="full-url">lambdamatters.com</span>
    </div>
  </div>
</body>
</html>
