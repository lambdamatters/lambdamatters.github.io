<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LambdaMatters — Systems Architecture · Distributed Systems · Applied Research</title>
  <meta property="og:title" content="LambdaMatters — Systems Architecture · Distributed Systems · Applied Research">
  <meta property="og:description" content="Systems Architecture · Distributed Systems · Applied Research">
  <meta property="og:url" content="https://lambdamatters.com/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <nav class="top-nav">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light mode">
      <!-- Sun icon (shown when dark, to switch to light) -->
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon icon (shown when light, to switch to dark) -->
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </nav>

  <main class="card">
    <div class="logo-wrapper">
      <svg class="logo" viewBox="0 0 120 100" width="68" height="54" fill="none" role="img" aria-label="LambdaMatters Logo">
        <defs>
          <!-- True negative-space knockout mask -->
          <mask id="site-interlock-gap">
            <rect width="120" height="100" fill="#ffffff" />
            <path d="M 73 44 C 65 54, 59 68, 51 79 L 60 79 C 65 68, 71 56, 76 47 Z"
                  fill="#000000" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
          </mask>
        </defs>
        <g fill="currentColor">
          <!-- Left Lambda (masked) -->
          <g mask="url(#site-interlock-gap)">
            <path d="M 36 22 C 37 28, 45 60, 57 78 L 50 78 C 42 62, 34 38, 33 26 Z" />
            <path d="M 35 44 C 27 54, 21 68, 14 78 L 21 78 C 26 68, 32 56, 37 47 Z" />
          </g>
          <!-- Right Lambda (weaves over) -->
          <path d="M 74 22 C 75 28, 83 60, 95 78 L 88 78 C 80 62, 72 38, 71 26 Z" />
          <path d="M 73 44 C 65 54, 59 68, 52 78 L 59 78 C 64 68, 70 56, 75 47 Z" />
        </g>
      </svg>
    </div>

    <h1 class="brand-name">LambdaMatters</h1>
    <p class="tagline">Systems Architecture · Distributed Systems · Applied Research</p>

    <footer class="footer">
      <a href="mailto:hello@lambdamatters.com">hello@lambdamatters.com</a>
    </footer>
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
